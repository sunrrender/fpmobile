name: Build debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists and is not empty
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -l "$APK"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG="apk-latest"
          cp "$APK" "FunPayMobile-debug.apk"
          NOTES="Автосборка ${GITHUB_SHA::7} (коммит ${GITHUB_SHA}). Debug-APK, не подписан для Google Play."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Последняя debug-сборка" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          gh release upload "$TAG" "FunPayMobile-debug.apk" --clobber
          gh release edit "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: FunPayMobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
